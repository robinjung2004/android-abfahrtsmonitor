name: Android-Projekt

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      pruefung:
        description: Welche bereits bearbeitete Phase soll zusätzlich geprüft werden?
        type: choice
        default: nur-build
        options:
          - nur-build
          - unterricht
          - kernhausaufgabe

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # Das alte Paket "tools" wird von Google nicht mehr angeboten.
          packages: platform-tools
      - name: Projekt-SDK installieren
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: App bauen und alle Tests kompilieren
        # Offene U-/H-Aufgaben sollen den Build nicht verhindern. Dieser Schritt
        # bestätigt die Kompilierbarkeit, nicht die fachliche Aufgabenerfüllung.
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest compileDebugUnitTestKotlin
      - name: Präsenzaufgaben prüfen
        if: inputs.pruefung == 'unterricht'
        run: ./gradlew --no-daemon testDebugUnitTest --tests '*Unterricht*'
      - name: Kernhausaufgabe und Präsenzgrundlage prüfen
        if: inputs.pruefung == 'kernhausaufgabe'
        run: ./gradlew --no-daemon testDebugUnitTest
